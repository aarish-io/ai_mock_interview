<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" fill="none">

    <defs>
        <!-- Gradient -->
        <linearGradient id="grad" x1="20" y1="20" x2="220" y2="220" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#7A00FF"/>
            <stop offset="55%" stop-color="#C400FF"/>
            <stop offset="100%" stop-color="#FF3CAC"/>
        </linearGradient>

        <!-- Glow -->
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Transparent background -->

    <!-- Outer Ring -->
    <circle cx="120" cy="120" r="88"
            stroke="url(#grad)"
            stroke-width="10"
            filter="url(#glow)"/>

    <!-- Chat Bubble -->
    <path d="
    M78 82
    C78 66 90 54 108 54
    H132
    C160 54 176 70 176 98
    V114
    C176 142 160 158 132 158
    H112
    L82 182
    L88 154
    C74 148 64 134 64 116
    V98
    C64 88 69 82 78 82
  "
          fill="rgba(20,0,40,0.12)"
          stroke="url(#grad)"
          stroke-width="8"
          stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- AI Nodes -->
    <g stroke="url(#grad)" stroke-width="4" stroke-linecap="round">
        <line x1="98" y1="92" x2="118" y2="78"/>
        <line x1="118" y1="78" x2="142" y2="92"/>
        <line x1="98" y1="92" x2="100" y2="120"/>
        <line x1="100" y1="120" x2="128" y2="134"/>
        <line x1="142" y1="92" x2="144" y2="120"/>
        <line x1="144" y1="120" x2="128" y2="134"/>
        <line x1="118" y1="78" x2="122" y2="106"/>
    </g>

    <g fill="url(#grad)">
        <circle cx="98" cy="92" r="5"/>
        <circle cx="118" cy="78" r="5"/>
        <circle cx="142" cy="92" r="5"/>
        <circle cx="100" cy="120" r="5"/>
        <circle cx="144" cy="120" r="5"/>
        <circle cx="128" cy="134" r="5"/>
        <circle cx="122" cy="106" r="5"/>
    </g>

    <!-- Signal Ring -->
    <path d="M168 58 A26 26 0 0 1 194 84"
          stroke="url(#grad)"
          stroke-width="6"
          stroke-linecap="round"/>

    <path d="M176 40 A44 44 0 0 1 220 84"
          stroke="url(#grad)"
          stroke-width="6"
          stroke-linecap="round"/>

</svg>